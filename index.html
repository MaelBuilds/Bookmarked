<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarked</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #F14D3A;
      --red-dark: #D93B28;
      --bg-gradient-top: #F14D3A;
      --bg-gradient-bottom: #FFE7DD;
      --white: #FFFFFF;
      --text-dark: #292929;
      --text-mid: #888888;
      --radius: 20px;
    }

    body {
      background: linear-gradient(160deg, var(--bg-gradient-top) 0%, var(--bg-gradient-bottom) 100%);
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 52px 24px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--white);
      font-size: 16px;
      font-weight: 500;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.9;
    }

    .back-btn svg { width: 18px; height: 18px; stroke: white; fill: none; stroke-width: 2; }

    .header-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.2px;
    }

    .header-icons {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .header-icons svg {
      width: 20px;
      height: 20px;
      stroke: white;
      fill: none;
      stroke-width: 1.5;
      opacity: 0.9;
    }

    /* ── Main ── */
    main {
      flex: 1;
      padding: 8px 20px 40px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Upload card ── */
    .upload-card {
      width: 100%;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      text-align: center;
      margin-bottom: 8px;
    }

    .headline {
      font-size: 26px;
      font-weight: 800;
      color: var(--white);
      text-align: center;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .subline {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .upload-area {
      background: rgba(255,255,255,0.18);
      border: 2px dashed rgba(255,255,255,0.5);
      border-radius: var(--radius);
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    .upload-area:hover {
      background: rgba(255,255,255,0.26);
      border-color: rgba(255,255,255,0.8);
    }

    .upload-area.has-image {
      padding: 0;
      border: none;
    }

    .upload-area img.preview {
      width: 100%;
      border-radius: calc(var(--radius) - 2px);
      display: block;
      max-height: 320px;
      object-fit: cover;
    }

    .upload-icon { font-size: 40px; margin-bottom: 12px; }

    .upload-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 4px;
    }

    .upload-sublabel {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
    }

    input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      padding: 17px;
      background: var(--white);
      color: var(--red);
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 20px;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.1px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .btn-primary:hover { opacity: 0.93; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-ghost {
      width: 100%;
      padding: 15px;
      background: transparent;
      color: var(--white);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-ghost:hover {
      border-color: var(--white);
      background: rgba(255,255,255,0.08);
    }

    /* ── Error ── */
    .error-msg {
      display: none;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--white);
      margin-top: 14px;
      font-weight: 500;
      text-align: center;
      backdrop-filter: blur(4px);
    }
    .error-msg.visible { display: block; }

    /* ── Loading ── */
    .loading {
      display: none;
      text-align: center;
      padding: 60px 0;
      width: 100%;
    }
    .loading.visible { display: block; }

    .spinner { display: none; }

    /* Flat book with flipping pages */
    .book {
      width: 90px;
      height: 70px;
      position: relative;
      margin: 0 auto 24px;
    }

    .book-body {
      width: 90px;
      height: 64px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 3px 8px 8px 3px;
      position: relative;
      overflow: hidden;
    }

    /* Spine line */
    .book-body::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(255,255,255,0.4);
    }

    /* Flipping page */
    .book-page {
      position: absolute;
      top: 6px;
      left: 14px;
      right: 6px;
      bottom: 6px;
      background: rgba(255,255,255,0.85);
      border-radius: 1px 4px 4px 1px;
      transform-origin: left center;
      animation: page-flip 1.6s ease-in-out infinite;
    }

    .book-page:nth-child(2) {
      background: rgba(255,255,255,0.6);
      animation-delay: 0.2s;
    }

    .book-page:nth-child(3) {
      background: rgba(255,255,255,0.35);
      animation-delay: 0.4s;
    }

    /* Horizontal lines on page */
    .book-page::before {
      content: '';
      position: absolute;
      top: 8px; left: 8px; right: 8px;
      height: 2px;
      background: rgba(241,77,58,0.25);
      box-shadow: 0 8px 0 rgba(241,77,58,0.2), 0 16px 0 rgba(241,77,58,0.15), 0 24px 0 rgba(241,77,58,0.1);
      border-radius: 1px;
    }

    @keyframes page-flip {
      0%   { transform: scaleX(1); }
      35%  { transform: scaleX(-0.05); }
      50%  { transform: scaleX(0); }
      65%  { transform: scaleX(-0.05); }
      100% { transform: scaleX(1); }
    }

    .loading-label {
      font-size: 17px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 6px;
    }

    .loading-step {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 24px;
      min-height: 20px;
      transition: opacity 0.3s;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.2);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--white);
      border-radius: 99px;
      transition: width 0.6s ease;
    }

    /* ── Result ── */
    .result { display: none; width: 100%; }
    .result.visible { display: block; }

    .result-sheet {
      background: var(--white);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: 0 8px 40px rgba(241,77,58,0.2);
    }

    .book-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFF0EE;
      color: var(--red);
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .result-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 18px;
      line-height: 1.3;
    }

    .divider {
      height: 1px;
      background: #F0EAE8;
      margin-bottom: 18px;
    }

    .summary-text {
      font-size: 15px;
      line-height: 1.8;
      color: #3D2E2B;
    }

    .summary-text p + p { margin-top: 14px; }
  </style>
</head>
<body>

<header>
  <button class="back-btn" style="visibility:hidden">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </button>
  <span class="header-title">🔖 Bookmarked</span>
  <div class="header-icons">
    <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
  </div>
</header>

<main>

  <!-- Upload view -->
  <div class="upload-card" id="upload-card">
    <p class="eyebrow">No spoilers</p>
    <h1 class="headline">Where did you stop?</h1>
    <p class="subline">Photo your current page. We'll catch you up from the beginning — nothing beyond it.</p>

    <div class="upload-area" id="upload-area">
      <div class="upload-icon">📖</div>
      <div class="upload-label">Tap to photograph your page</div>
      <div class="upload-sublabel">or drop an image here</div>
      <input type="file" accept="image/*" capture="environment" id="file-input" />
    </div>

    <div class="error-msg" id="error-msg"></div>
    <button class="btn-primary" id="submit-btn" disabled>Catch me up →</button>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="book">
      <div class="book-body">
        <div class="book-page"></div>
        <div class="book-page"></div>
        <div class="book-page"></div>
      </div>
    </div>
    <div class="loading-label">One moment…</div>
    <div class="loading-step" id="loading-step"></div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- Result -->
  <div class="result" id="result-card">
    <div class="result-sheet">
      <div class="book-chip">📚 <span id="book-title"></span></div>
      <div class="result-title">Here's where you left off</div>
      <div class="divider"></div>
      <div class="summary-text" id="summary-body"></div>
    </div>
    <button class="btn-ghost" id="try-again">← Try another page</button>
  </div>

</main>

<script>
  const uploadArea = document.getElementById('upload-area');
  const submitBtn = document.getElementById('submit-btn');
  const uploadCard = document.getElementById('upload-card');
  const loadingEl = document.getElementById('loading');
  const loadingStep = document.getElementById('loading-step');
  const fill = document.getElementById('progress-fill');
  const resultCard = document.getElementById('result-card');
  const bookTitle = document.getElementById('book-title');
  const summaryBody = document.getElementById('summary-body');
  const tryAgain = document.getElementById('try-again');
  const errorMsg = document.getElementById('error-msg');

  let imageBase64 = null;

  function resetUploadArea() {
    uploadArea.classList.remove('has-image');
    uploadArea.innerHTML = `
      <div class="upload-icon">📖</div>
      <div class="upload-label">Tap to photograph your page</div>
      <div class="upload-sublabel">or drop an image here</div>
      <input type="file" accept="image/*" capture="environment" id="file-input" />`;
    bindFileInput();
  }

  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const dataUrl = ev.target.result;
      imageBase64 = dataUrl.split(',')[1];
      uploadArea.innerHTML = `<img class="preview" src="${dataUrl}" alt="Page preview" />`;
      uploadArea.classList.add('has-image');
      submitBtn.disabled = false;
      errorMsg.classList.remove('visible');
    };
    reader.readAsDataURL(file);
  }

  function bindFileInput() {
    const input = document.getElementById('file-input');
    if (!input) return;
    input.addEventListener('change', (e) => handleFile(e.target.files[0]));
  }

  // Drag and drop
  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.style.background = 'rgba(255,255,255,0.3)';
  });
  uploadArea.addEventListener('dragleave', () => {
    uploadArea.style.background = '';
  });
  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.style.background = '';
    handleFile(e.dataTransfer.files[0]);
  });

  bindFileInput();

  function setStep(index, set, pct) {
    loadingStep.style.opacity = 0;
    fill.style.width = pct + '%';
    setTimeout(() => {
      loadingStep.textContent = set[index];
      loadingStep.style.opacity = 1;
    }, 300);
  }

  submitBtn.addEventListener('click', async () => {
    if (!imageBase64) return;
    uploadCard.style.display = 'none';
    loadingEl.classList.add('visible');

    const sets = [
      ["Adjusting reading glasses…", "Analyzing the page…", "Shushing the spoilers…"],
      ["Finding your bookmark…", "Cross-referencing the plot…", "Sealing the spoiler vault…"],
      ["Waking the librarian…", "Speed-reading the chapters…", "Building your memory palace…"],
    ];
    const set = sets[Math.floor(Math.random() * sets.length)];

    try {
      setStep(0, set, 5);
      const ocrResp = await fetch('/ocr', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imageBase64 })
      });
      const { text } = await ocrResp.json();
      fill.style.width = '33%';

      setStep(1, set, 38);
      const identResp = await fetch('/identify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      const identData = await identResp.json();
      fill.style.width = '66%';

      if (identData.status === 'needs_cover') {
        loadingEl.classList.remove('visible');
        fill.style.width = '0%';
        uploadCard.style.display = 'block';
        errorMsg.textContent = "Couldn't identify the book from this page. Try a photo of the cover or spine.";
        errorMsg.classList.add('visible');
        submitBtn.disabled = true;
        resetUploadArea();
        return;
      }

      setStep(2, set, 70);
      const sumResp = await fetch('/summarize', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, book: identData.book })
      });
      const { summary } = await sumResp.json();

      fill.style.width = '100%';
      loadingStep.textContent = 'Done ✓';
      await new Promise(r => setTimeout(r, 500));

      loadingEl.classList.remove('visible');
      fill.style.width = '0%';

      bookTitle.textContent = identData.book;
      summaryBody.innerHTML = summary
        .split('\n\n').filter(p => p.trim())
        .map(p => `<p>${p.trim()}</p>`).join('');
      resultCard.classList.add('visible');

    } catch (err) {
      loadingEl.classList.remove('visible');
      fill.style.width = '0%';
      uploadCard.style.display = 'block';
      errorMsg.textContent = 'Something went wrong. Please try again.';
      errorMsg.classList.add('visible');
    }
  });

  tryAgain.addEventListener('click', () => {
    resultCard.classList.remove('visible');
    uploadCard.style.display = 'block';
    submitBtn.disabled = true;
    imageBase64 = null;
    errorMsg.classList.remove('visible');
    resetUploadArea();
  });
</script>

</body>
</html>
