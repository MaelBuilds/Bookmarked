# Python API + Node/Vite SPA: install both, build frontend before start.
providers = ["python", "node"]

[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "cd frontend && npm ci",
]

[phases.build]
cmds = ["cd frontend && npm run build"]

[start]
cmd = "gunicorn server:app"
